#eyes:after{display:block!important;content:"";position:absolute!important;inset:0!important;background-image:url("./1000116107(3).jpg")!important;background-size:cover!important;background-position:center center!important;background-repeat:no-repeat!important;filter:none!important;mask-image:none!important;opacity:1!important;transform:none!important}
#ronova-hd-eyes{display:none!important}

#ronova-admin-button{position:fixed;left:12px;bottom:12px;z-index:20;border:1px solid #783544;border-radius:50%;background:#160812dd;color:#eac6cd;padding:10px 13px;cursor:pointer;font:14px Georgia,serif}
#ronova-admin-dialog{border:1px solid #a5465a;border-radius:14px;background:#160912;color:#f5d9d3;padding:23px;width:min(92vw,420px);box-shadow:0 0 90px #000}
#ronova-admin-dialog::backdrop{background:#080007bb;backdrop-filter:blur(5px)}
#ronova-admin-dialog input{width:100%;padding:12px;background:#260f1c;color:#fff;border:1px solid #8b4355;border-radius:8px;margin:10px 0}
#ronova-admin-dialog button{padding:10px 12px;margin:5px 4px;background:#351120;color:#ffe2e3;border:1px solid #934258;border-radius:8px;cursor:pointer}
#ronova-admin-dialog p{line-height:1.5}
#ronova-admin-dialog .admin-actions{display:flex;flex-wrap:wrap}

#ronova-ost-player{position:fixed;right:12px;bottom:65px;z-index:19;width:min(92vw,355px);padding:12px;background:#140812f4;border:1px solid #9d4358;border-radius:12px;color:#f7c3c8;box-shadow:0 12px 42px #000a}
#ronova-ost-player[hidden]{display:none!important}
.ronova-ost-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font:14px Georgia,serif}
#ronova-ost-close{border:0;background:transparent;color:#ffe2e5;font-size:24px;cursor:pointer}
#ronova-ost-frame{width:100%;aspect-ratio:16/9;background:#090409;border-radius:6px;overflow:hidden}
#ronova-ost-frame iframe{display:block;width:100%;height:100%;border:0}
#ronova-ost-player p{font-size:11px;line-height:1.4;margin:8px 0 0;color:#d6b1bd}

/* Mobile-safe OST controls: keep YouTube player from covering the puzzle. */
#ronova-ost-player{position:fixed!important;right:8px!important;bottom:54px!important;width:190px!important;max-width:calc(100vw - 16px)!important;padding:7px!important;max-height:150px!important;overflow:hidden!important;z-index:19!important}
#ronova-ost-frame{height:107px!important;aspect-ratio:16/9!important}
#ronova-ost-player p{display:none!important}
#ronova-ost-player .ronova-ost-header{font-size:11px!important;margin-bottom:4px!important}
@media(max-width:600px){
 #ronova-ost-player{right:6px!important;bottom:57px!important;width:150px!important;max-height:120px!important;padding:5px!important}
 #ronova-ost-frame{height:84px!important}
 #ronova-ost-player .ronova-ost-header{font-size:10px!important}
}
.binary-key{list-style:none;padding:0;max-height:12rem;overflow:auto;font:14px/1.7 monospace}#clue{overflow-wrap:anywhere}

#timer{font:700 clamp(24px,4.4vw,54px)/1.25 monospace!important;letter-spacing:clamp(1px,.45vw,6px)!important;color:#fff3e4!important;background:#16040ded;border:1px solid #f76d76;border-radius:12px;padding:9px 18px;max-width:100%;box-shadow:0 0 24px #ff284644,inset 0 0 20px #ff33401c;text-shadow:0 2px 2px #000!important;font-variant-numeric:tabular-nums}
#puzzle{max-height:90dvh;overflow:auto}
.cipher-text{padding:18px 12px;border:1px solid #c85868;border-radius:8px;background:#08030b;color:#ffe6bb;font:700 21px/1.8 monospace;letter-spacing:2px;overflow-wrap:anywhere}
.cipher-text:empty{display:none}
.cipher-explanation{font-size:15px;color:#ead3d0}
.cipher-alphabet{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px;margin:15px 0}
.cipher-alphabet span{padding:7px 3px;border:1px solid #73313e;border-radius:4px;background:#240b16;text-align:center;font:15px/1.4 monospace;color:#ffe2d5}
#ronova-second-hand{filter:drop-shadow(0 0 4px #ff2848)}
.ronova-fire{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;background:radial-gradient(ellipse at 50% 90%,#f4183220,transparent 65%)}

.ronova-fire{background:linear-gradient(0deg,#b82d0b28,transparent 20%);isolation:isolate}
.ronova-fire::before,.ronova-fire::after{content:"";position:absolute;left:-20%;bottom:-12vh;width:140%;height:46vh;background:radial-gradient(ellipse at 15% 80%,#acb0b145,transparent 30%),radial-gradient(ellipse at 48% 60%,#b3b7ba38,transparent 35%),radial-gradient(ellipse at 78% 80%,#d0c5bb48,transparent 32%),radial-gradient(ellipse at 60% 100%,#af41162b,transparent 50%);filter:blur(19px);animation:ronovaSmoke 16s ease-in-out infinite alternate}
.ronova-fire::after{bottom:-17vh;opacity:.7;animation-duration:23s;animation-delay:-9s;transform:scaleX(-1)}
.ronova-fire i{position:absolute;left:var(--x);bottom:-12px;width:2px;height:var(--size);background:linear-gradient(#ffdd91,#e76521 65%,transparent);border-radius:50%;box-shadow:0 0 5px #ec6e20;animation:ronovaEmber var(--duration) var(--delay) linear infinite}
@keyframes ronovaSmoke{from{translate:-3% 3%;scale:1;opacity:.45}to{translate:5% -9%;scale:1.12;opacity:.8}}
@keyframes ronovaEmber{0%{transform:translate3d(0,0,0) rotate(-20deg);opacity:0}8%{opacity:.9}55%{opacity:.65}100%{transform:translate3d(var(--drift),-48vh,0) rotate(35deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.ronova-fire i{animation:none}}

#timer{display:flex;align-items:center;justify-content:center;gap:clamp(3px,.7vw,7px);padding:12px 5px;background:transparent;border:0;border-radius:0;box-shadow:none;text-shadow:none!important}
.digital-digit{display:block;position:relative;width:clamp(20px,4.8vw,37px);height:clamp(36px,8.6vw,66px)}
.segment{position:absolute;background:#441017;opacity:.18}
.segment.lit{background:#fff0be;opacity:1;filter:drop-shadow(0 0 3px #ff202b) drop-shadow(0 0 8px #ff142b)}
.segment.a,.segment.d,.segment.g{height:8%;width:76%;left:12%;clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%)}
.segment.a{top:0}.segment.g{top:46%}.segment.d{bottom:0}
.segment.b,.segment.c,.segment.e,.segment.f{width:12%;height:42%;clip-path:polygon(50% 0,100% 12%,100% 88%,50% 100%,0 88%,0 12%)}
.segment.b{right:0;top:5%}.segment.c{right:0;bottom:5%}.segment.e{left:0;bottom:5%}.segment.f{left:0;top:5%}
.digital-colon{width:5px;height:42px;position:relative;margin:0 3px}
.digital-colon:before,.digital-colon:after{content:"";position:absolute;width:5px;height:5px;left:0;border-radius:50%;background:#fff0be;box-shadow:0 0 8px 3px #ff173e}
.digital-colon:before{top:10px}.digital-colon:after{bottom:10px}
#expired{z-index:100;background:radial-gradient(ellipse at center,#420814,#070105 70%);overflow:hidden;padding:24px}
#ronova-admin-button{z-index:110}
#final-pixel-eyes{position:absolute;top:3vh;left:50%;translate:-50% 0;width:min(96vw,1100px);height:65vh;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
#expired{background:#000}
.final-message{z-index:1;position:absolute;bottom:9vh;width:min(90vw,850px);font:clamp(20px,3vw,36px)/1.6 Georgia;color:#ffe0d5;text-align:center;text-shadow:0 2px 12px #000;animation:finalText 3s ease both}
@keyframes finalEyeOpen{from{opacity:0;transform:rotate(0) scaleY(.015)}to{opacity:1;transform:rotate(0) scaleY(1)}}
@keyframes finalText{0%,45%{opacity:0;translate:0 15px}100%{opacity:1;translate:0 0}}
#expired[style*="flex"]~#ronova-ost-player{visibility:hidden}
#ronova-admin-dialog{max-height:90dvh;overflow:auto}
#puzzle-controls details{border-top:1px solid #713341;padding:12px 0}
#puzzle-controls summary{cursor:pointer;color:#ffb5ab}
#puzzle-controls label{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:15px}
#puzzle-controls input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:#c83952}
#puzzle-controls select{max-width:100%;background:#260f1c;color:#fff;padding:8px;border:1px solid #934258}
#prophecy [hidden],#puzzle [hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.final-message,.ronova-fire::before,.ronova-fire::after{animation:none}}

.final-message{font-family:'Another Danger RU',Georgia,serif;font-size:clamp(28px,4.1vw,52px);font-weight:400;line-height:1.35;color:#ff202c;text-transform:uppercase;letter-spacing:.025em;width:min(92vw,1080px);bottom:5vh;margin:0;text-shadow:0 0 8px #ff10265c,0 2px 2px #000}
#final-pixel-eyes{height:56vh}
@media(max-width:600px){.final-message{font-size:clamp(25px,6.2vw,36px);bottom:6vh}#final-pixel-eyes{height:48vh;top:4vh}}
@media(max-height:500px) and (min-width:601px){.final-message{font-size:clamp(24px,3vw,34px);bottom:3vh}#final-pixel-eyes{height:50vh;top:0}}

/* Center the final message over the eyes with longer lines. */
#expired .final-message{top:50%;bottom:auto;left:50%;width:96vw;max-width:1600px;transform:translate(-50%,-50%);margin:0;font-size:clamp(28px,4vw,56px);line-height:1.5;text-align:center;text-shadow:0 0 8px #ff10265c,0 3px 12px #000,0 0 25px #000;z-index:2}
#expired .final-message::before{content:"";position:absolute;inset:-22px -2vw;background:#0009;filter:blur(18px);z-index:-1;pointer-events:none}
@media(max-width:600px){#expired .final-message{font-size:clamp(26px,6vw,36px);width:94vw;line-height:1.45}}
@media(max-height:500px) and (min-width:601px){#expired .final-message{font-size:clamp(24px,3.5vw,38px);line-height:1.3}}

/* Keep eyes and message in separate rows; fire fills the lower edge. */
#expired{flex-direction:column;justify-content:center;gap:clamp(8px,2vh,22px);padding:3vh 2vw 12vh}
#expired #final-pixel-eyes{position:relative;top:auto;left:auto;translate:none;transform:none;flex:0 1 auto;width:min(94vw,1040px);height:47vh;max-height:47vh;object-fit:contain;z-index:1}
#expired .final-message{position:relative;top:auto;bottom:auto;left:auto;transform:none;translate:none;flex:0 0 auto;width:min(96vw,1400px);font-size:clamp(26px,3.5vw,48px);line-height:1.3;margin:0;z-index:2}
#expired .final-message::before{display:none}
#expired .final-fire{position:absolute;z-index:0;inset:0;background:linear-gradient(0deg,#d54a1440,transparent 30%)}
#expired .final-fire::before,#expired .final-fire::after{height:38vh}
@media(max-width:600px){#expired{padding-bottom:10vh;gap:12px}#expired #final-pixel-eyes{height:38vh;max-height:38vh}#expired .final-message{font-size:clamp(24px,5.7vw,34px);line-height:1.35}}
@media(max-height:500px) and (min-width:601px){#expired{gap:6px;padding-bottom:5vh}#expired #final-pixel-eyes{height:42vh;max-height:42vh}#expired .final-message{font-size:clamp(22px,2.8vw,32px);line-height:1.2}}

function binary(s){return [...new TextEncoder().encode(s)].map(x=>x.toString(2).padStart(8,'0')).join(' ')}
function atbash(s){const a=russianAlphabet;return [...s].map(c=>a.includes(c)?a[a.length-1-a.indexOf(c)]:c).join('')}

let solved=new Set(JSON.parse(localStorage.getItem(solvedKey)||'[]')),active=null;
const prop=document.getElementById('prophecy'),dialog=document.getElementById('puzzle');
function render(){prop.innerHTML='';text.split(/(\s+)/).forEach((part)=>{if(/^\s+$/.test(part)){prop.append(document.createTextNode(part));return}let word=part.toLowerCase().replace(/[^а-яё]/g,'');if(puzzles[word]&&!solved.has(word)){let b=document.createElement('button');b.className='secret';b.title='Открыть загадку';b.setAttribute('aria-label','Зашифрованное слово');b.innerHTML=symbols(word)+(part.endsWith(',')?',':'');b.dataset.word=word;b.onclick=()=>openPuzzle(word);prop.append(b)}else{let span=document.createElement('span');span.className='word';span.dataset.word=word;span.textContent=part;prop.append(span)}})}
function openPuzzle(word){active=word;document.getElementById('puzzleTitle').textContent='Испытание Роновы';document.getElementById('clue').textContent=puzzles[word][0]+': '+puzzles[word][1];document.getElementById('answer').value='';document.getElementById('error').textContent='';dialog.showModal()}
document.getElementById('close').onclick=()=>dialog.close();document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();let answer=document.getElementById('answer').value.trim().toLowerCase().replace(/ё/g,'е');if(answer===active.replace(/ё/g,'е')){solved.add(active);localStorage.setItem(solvedKey,JSON.stringify([...solved]));dialog.close();render()}else document.getElementById('error').textContent='Ответ неверен. Попробуй ещё.'};

/* Working pigpen substitution with a visible decoding key. */
(function(){
const alphabet=russianAlphabet;
function glyph(letter){
 const n=alphabet.indexOf(letter.toLowerCase());if(n<0)return '';
 const cell=n%9,row=Math.floor(cell/3),col=cell%3;
 const vertical=['M46 4 V46','M4 4 V46 M46 4 V46','M4 4 V46'];
 const horizontal=['M4 46 H46','M4 4 H46 M4 46 H46','M4 4 H46'];
 let d=vertical[col]+' '+horizontal[row];
 let dot=n>=9&&n<18;let cross=n>=18;
 if(cross){const k=n-18;const a=(k%8)*Math.PI/4;d='M25 25 L'+(25+21*Math.cos(a)).toFixed(1)+' '+(25+21*Math.sin(a)).toFixed(1)+' M25 25 L'+(25+21*Math.cos(a+Math.PI/2)).toFixed(1)+' '+(25+21*Math.sin(a+Math.PI/2)).toFixed(1);dot=n>=26}
 return '<svg viewBox="0 0 50 50" role="img" aria-label="Символ шифра"><path d="'+d+'" fill="none" stroke="#f27888" stroke-width="3" stroke-linecap="square"/>'+(dot?'<circle cx="25" cy="25" r="3.5" fill="#ffd6ce"/>':'')+'</svg>';
}
function drawPigpen(word){
 const cipher='<div class="pigpen-cipher">'+[...word].map(c=>'<span class="pigpen-cell">'+glyph(c)+'</span>').join('')+'</div>';
 const key='<div class="pigpen-key">'+[...alphabet].map(c=>'<div class="pigpen-key-item">'+glyph(c)+'<span>'+c.toUpperCase()+'</span></div>').join('')+'</div>';
 return '<div class="pigpen-wrap"><div class="pigpen-hint">Каждый символ соответствует одной букве. Сопоставь знаки с таблицей и введи полученное слово.</div>'+cipher+'<details><summary>Показать ключ масонского шифра</summary>'+key+'</details></div>';
}
const oldOpen=openPuzzle;
openPuzzle=function(word){
 const aid=document.getElementById('puzzle-aid');
 aid.replaceChildren();
 if(word==='застыл'){
  aid.innerHTML=drawPigpen(word);
 }
 if(puzzles[word][0]==='Двоичный код'){
  const key=document.createElement('details');
  const summary=document.createElement('summary');
  summary.textContent='Показать таблицу UTF-8';
  const rows=document.createElement('ul');
  rows.className='binary-key';
  for(const letter of russianAlphabet){
   const row=document.createElement('li');
   row.textContent=letter+' = '+binary(letter);
   rows.append(row);
  }
  key.append(summary,rows);
  aid.append(key);
 }
 oldOpen(word);
};
})();

/* Actual wall clock: local device time, no fake animation or fixed countdown angle. */
(function(){
const clock=document.getElementById('clock');
if(!clock)return;
const svg=clock.querySelector('.ronova-clock-svg');
if(!svg)return;
const minute=svg.querySelector('#ronova-minute-rotor'),hour=svg.querySelector('#ronova-hour-rotor');
if(!minute||!hour)return;
// Remove earlier interval updates by moving the rotors to fresh clones.
const m=minute.cloneNode(true),hr=hour.cloneNode(true);
minute.replaceWith(m);hour.replaceWith(hr);
m.id='ronova-real-minute';hr.id='ronova-real-hour';
function sync(){
 const d=new Date();
 const seconds=d.getSeconds()+d.getMilliseconds()/1000;
 const minutes=d.getMinutes()+seconds/60;
 const hours=d.getHours()%12+minutes/60;
 // Original hands point diagonally at 38°; offset makes their position correspond to real clock numerals.
 m.setAttribute('transform','rotate('+(minutes*6-128)+' 295 210)');
 hr.setAttribute('transform','rotate('+(hours*30-128)+' 295 210)');
 svg.setAttribute('aria-label','Часы Роновы: '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
}
sync();setInterval(sync,250);
})();

function drawDigitalTimer(node,label){
 if(node.dataset.time===label)return;
 node.dataset.time=label;
 node.setAttribute('aria-label',label);
 const segments=['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'];
 const fragment=document.createDocumentFragment();
 for(const char of label){
  const digit=document.createElement('span');
  digit.setAttribute('aria-hidden','true');
  if(char===':'){digit.className='digital-colon';}
  else{
   digit.className='digital-digit';
   for(const name of 'abcdefg'){
    const bar=document.createElement('i');
    bar.className='segment '+name+(segments[Number(char)].includes(name)?' lit':'');
    digit.append(bar);
   }
  }
  fragment.append(digit);
 }
 node.replaceChildren(fragment);
}

/* Low-resolution eyes keep the reference's sharp pixel silhouette. */
(function(){
 const canvas=document.getElementById('final-pixel-eyes');
 const context=canvas.getContext('2d');
 const ending=document.getElementById('expired');
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
 const eyes=[[120,72,45],[32,38,13],[78,21,15],[175,12,12],[199,43,16],[51,85,15],[184,98,16],[21,117,14],[76,128,13],[199,127,13],[140,113,11],[124,32,12]];
 let openedAt=0;
 let frame=0;
 let running=false;
 function drawEye(cx,cy,size,opening,time,index){
  const height=size*.44*opening;
  if(height<1)return;
  const gaze=reduced.matches?0:Math.round(Math.sin(time/2700+index)*1.5);
  for(let y=-Math.ceil(height);y<=height;y++){
   const width=size*(1-Math.abs(y)/(height+1)*.68);
   for(let x=-Math.floor(width);x<=width;x++){
    const irisX=x-gaze;
    const iris=irisX*irisX+(y/opening)*(y/opening)<size*size*.21;
    const pupil=irisX*irisX+(y/opening)*(y/opening)<size*size*.034;
    let color=iris?'#b71a24':'#e9e9e1';
    if(iris&&y<-height*.6)color='#810910';
    if(pupil)color='#000000';
    if(Math.abs(x)>width-2)color='#ed6371';
    if(iris&&irisX>size*.15&&irisX<size*.27&&y>-height*.65&&y<-height*.4)color='#ffffff';
    context.fillStyle=color;context.fillRect(cx+x,cy+y,1,1);
   }
  }
 }
 function paint(time){
  if(!running)return;
  if(!openedAt)openedAt=time;
  context.clearRect(0,0,240,140);
  const elapsed=time-openedAt;
  eyes.forEach(([x,y,size],index)=>{
   const entrance=reduced.matches?1:Math.min(1,Math.max(0,(elapsed-index*60)/1500));
   const phase=(elapsed+index*491)%7100;
   const blink=reduced.matches||elapsed<2200?1:phase<200?Math.max(.06,Math.abs(phase-100)/100):1;
   drawEye(x,y,size,entrance*blink,time,index);
  });
  frame=requestAnimationFrame(paint);
 }
 function sync(){
  const visible=ending.style.display==='flex'&&!document.hidden;
  if(visible===running)return;
  running=visible;cancelAnimationFrame(frame);
  if(visible){openedAt=0;frame=requestAnimationFrame(paint);}
 }
 new MutationObserver(sync).observe(ending,{attributes:true,attributeFilter:['style']});
 document.addEventListener('visibilitychange',sync);
 sync();
})();
