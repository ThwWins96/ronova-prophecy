<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пророчество Роновы</title>
<style>
:root{color-scheme:dark;font-family:Georgia,'Times New Roman',serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 55%,#631c22 0%,#25070c 48%,#080307 100%);color:#f5d9d3;overflow-x:hidden}
#eyes{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:.8}.eye{position:absolute;width:var(--w);height:calc(var(--w)*.38);border:2px solid #b83b38;border-radius:90% 10% 90% 10%/80% 15% 85% 20%;transform:rotate(var(--r));box-shadow:0 0 15px #f44a3d, inset 0 0 20px #c23434;animation:blink 8s infinite;animation-delay:var(--d)}.eye:before{content:"";position:absolute;left:40%;top:7%;height:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffe0ba 0 8%,#ff5647 12%,#3e090e 37%,#c8443c 56%,transparent 70%);box-shadow:0 0 22px #fd6558}@keyframes blink{0%,90%,100%{scale:1 1}93%{scale:1 .08}96%{scale:1 1}}
main{position:relative;z-index:2;max-width:1100px;min-height:100vh;margin:auto;padding:22px 18px 80px;display:flex;flex-direction:column;align-items:center;text-align:center}
.clock{position:relative;width:190px;height:190px;border-radius:50%;border:2px solid #9f202b;box-shadow:0 0 30px #9e1b2d88,inset 0 0 40px #8b142355;background:radial-gradient(circle,#16030b 45%,#3b0912);margin:10px auto 15px}.clock span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(calc(var(--i)*30deg)) translateY(-76px) rotate(calc(var(--i)*-30deg));font-size:15px;color:#ff5964;text-shadow:0 0 8px #e22}.hand{position:absolute;bottom:50%;left:calc(50% - 2px);width:4px;transform-origin:bottom;background:#f33;box-shadow:0 0 8px #f33;border-radius:5px}.hand.hour{height:43px}.hand.minute{height:64px;width:2px}.center{position:absolute;left:calc(50% - 5px);top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#ffb3a5;box-shadow:0 0 15px #f44}
.timer{font:19px monospace;letter-spacing:5px;color:#ff8d87;text-shadow:0 0 12px #f44}h1{margin:48px 0 25px;text-transform:uppercase;font-weight:400;font-size:clamp(30px,6vw,62px);letter-spacing:.14em;text-shadow:0 0 13px #f22,0 0 35px #aa172a}
.prophecy{font-size:clamp(21px,3vw,33px);line-height:2.3;max-width:950px;color:#e7c9bd}.word{display:inline-block;margin:0 .12em;vertical-align:middle}.secret{background:transparent;border:0;cursor:pointer;padding:4px 7px;color:#c9a16d;vertical-align:middle;border-bottom:1px solid #9b5647;filter:drop-shadow(0 0 5px #e74b3d);transition:transform .2s}.secret:hover,.secret:focus-visible{transform:translateY(-3px);outline:1px solid #c97a65}.glyph{display:inline-block;width:22px;height:31px;object-fit:contain;vertical-align:middle}.fallback{font-family:serif;font-size:23px;color:#c9a16d}
.note{font-size:13px;letter-spacing:.12em;color:#c69a96;margin-top:30px}dialog{border:1px solid #8b3642;background:linear-gradient(135deg,#210912,#0b060e);color:#f8dcd5;border-radius:12px;width:min(92vw,500px);padding:28px;box-shadow:0 0 65px #ae172f88}dialog::backdrop{background:#000b;backdrop-filter:blur(6px)}dialog h2{color:#f39b8c;margin:0 0 15px}dialog p{line-height:1.7;overflow-wrap:anywhere}input{background:#120910;border:1px solid #9b4451;color:white;border-radius:6px;font:18px Georgia;padding:13px;width:100%;margin:12px 0}button.action{border:1px solid #a94750;background:#521621;color:#ffe2d9;padding:12px 22px;border-radius:7px;cursor:pointer}.close{float:right;background:none;color:#f5b2ac;border:0;font-size:26px;cursor:pointer}.error{color:#ff8888;min-height:22px}.expired{position:fixed;inset:0;background:#070305;z-index:10;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}.expired h2{color:#fa5555;font-size:clamp(35px,8vw,70px);font-weight:normal}
@media(prefers-reduced-motion:reduce){.eye{animation:none}}

/* Ronova visual overhaul */
body{background:radial-gradient(ellipse at 50% 78%,#67272c 0%,#29070d 42%,#0c0207 76%,#050104 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#ff7b7910 4px 5px),radial-gradient(ellipse at 50% 20%,transparent 12%,#09000599 85%);z-index:1}
#eyes{opacity:1;filter:contrast(1.2);mask-image:linear-gradient(#000 0%,#000 68%,transparent 100%)}
.eye{border:0!important;border-radius:0!important;box-shadow:none!important;background:none!important;animation:ronovaBlink 11s ease-in-out infinite!important;transform:rotate(var(--r));height:calc(var(--w)*.55)!important;filter:drop-shadow(0 0 10px #ef4e3f)}
.eye:before{display:none!important}
.eye svg{width:100%;height:100%;overflow:visible}
@keyframes ronovaBlink{0%,89%,100%{transform:rotate(var(--r)) scaleY(1)}92%{transform:rotate(var(--r)) scaleY(.08)}95%{transform:rotate(var(--r)) scaleY(1)}}
main{padding-top:15px}
.clock{width:min(70vw,320px)!important;height:min(70vw,320px)!important;margin:8px auto 14px!important;border:none!important;border-radius:50%;background:radial-gradient(circle at center,#05020b 0 36%,#23040e 48%,transparent 71%)!important;box-shadow:none!important;filter:drop-shadow(0 0 17px #f01632)}
.clock:before{content:"";position:absolute;inset:12%;border:3px solid #e02336;border-radius:50%;box-shadow:0 0 12px #f0283f,inset 0 0 23px #e5233855;opacity:.9}
.clock:after{content:"";position:absolute;inset:-15%;border-radius:50%;background:repeating-conic-gradient(from 5deg,transparent 0 27deg,#9c0b2a 28deg,#ea173c 29deg,transparent 30deg);mask:radial-gradient(circle,transparent 0 54%,#000 57%,transparent 73%);opacity:.6;pointer-events:none;animation:rotateHalo 80s linear infinite}
@keyframes rotateHalo{to{transform:rotate(360deg)}}
.clock span{font-size:clamp(17px,4.3vw,28px)!important;font-weight:bold;color:#ed253f!important;text-shadow:0 0 7px #ff1c35,0 0 19px #e01b36!important;transform:translate(-50%,-50%) rotate(calc(var(--i)*30deg)) translateY(calc(min(70vw,320px)*-.39)) rotate(calc(var(--i)*-30deg))!important}
.clock .hand{z-index:3;background:linear-gradient(90deg,#7b1025,#ff3951,#78041a)!important;clip-path:polygon(50% 0,100% 15%,68% 100%,32% 100%,0 15%);box-shadow:none!important}
.clock .hand.hour{height:25%!important;width:12px!important;left:calc(50% - 6px)!important}
.clock .hand.minute{height:39%!important;width:7px!important;left:calc(50% - 3.5px)!important}
.clock .center{z-index:4;background:#ffb5a0!important;box-shadow:0 0 7px #fff,0 0 25px #f22!important}
.clock .sigil{position:absolute;inset:33%;width:34%;height:34%;opacity:.85;pointer-events:none;filter:drop-shadow(0 0 5px #fb3448)}
.timer{font-size:clamp(17px,4vw,25px);letter-spacing:.28em;color:#ff777b}
h1{margin:24px 0 26px;font-family:Georgia,serif;font-size:clamp(29px,6vw,62px);letter-spacing:.11em;color:#ffdfd4;text-shadow:0 0 7px #ff3e48,0 0 22px #e01e39,0 0 55px #b61230}
.prophecy{background:linear-gradient(135deg,#17060dbd,#1b0810cc);padding:clamp(18px,4vw,45px);border:1px solid #9d394460;box-shadow:0 0 55px #060006a8,inset 0 0 38px #7a142012;border-radius:6px;line-height:2.2}
.secret{border-bottom:1px solid #b88b57;filter:drop-shadow(0 0 5px #e9a25e);padding:4px 3px}
.ronova-rune{height:1.1em;width:.76em;vertical-align:-.12em;overflow:visible;margin:0 .01em}
.ronova-rune path,.ronova-rune circle{stroke:#c4a16a;stroke-width:3.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ronova-rune .filled{fill:#c4a16a;stroke:none}
.note{color:#b18a83}
dialog{border-color:#b34a4b;box-shadow:0 0 60px #b41432a0}

/* Reference-driven visual reconstruction: crimson eye field and asymmetric dial */
body{background:radial-gradient(ellipse at 50% 40%,#43121a 0%,#19030c 43%,#08020a 78%,#030106 100%)}
#eyes{mask-image:none!important;opacity:.95!important;z-index:0;mix-blend-mode:screen}
.eye{filter:drop-shadow(0 0 7px #fa5646) drop-shadow(0 0 20px #b52c27)!important}
.eye svg{overflow:visible}
main{z-index:2}
.clock{width:min(84vw,440px)!important;height:min(84vw,440px)!important;filter:drop-shadow(0 0 17px #b80c1c)!important;background:radial-gradient(circle,#03020b 0 37%,#09010a 55%,transparent 72%)!important}
.clock:before,.clock:after{display:none!important}
.clock .dial-art{position:absolute;inset:-8%;width:116%;height:116%;overflow:visible;pointer-events:none}
.clock span{font-family:Georgia,serif!important;color:#f11b2c!important;font-size:clamp(23px,5vw,43px)!important;text-shadow:0 0 4px #ed1128,0 0 19px #b00013!important;font-weight:normal!important;transform:translate(-50%,-50%) rotate(calc(var(--i)*30deg)) translateY(calc(min(84vw,440px)*-.36)) rotate(calc(var(--i)*-30deg))!important;z-index:3}
.clock .hand{z-index:5!important;bottom:auto!important;top:50%;transform-origin:50% 0!important;clip-path:none!important;background:transparent!important;box-shadow:none!important;border-radius:0!important;width:0!important;height:0!important}
.clock .hand:before{content:"";position:absolute;top:0;left:-6px;width:12px;height:150px;background:#fa192a;clip-path:polygon(50% 0,100% 15%,66% 62%,54% 100%,42% 64%,0 15%);filter:drop-shadow(0 0 8px #f31)}
.clock .hand.hour:before{height:100px;width:15px;left:-7px}
.clock .center{z-index:8;left:calc(50% - 8px)!important;top:calc(50% - 8px)!important;width:16px!important;height:16px!important;background:#ff2736!important}
.clock .sigil{display:none!important}
.prophecy{backdrop-filter:blur(5px)}
@media(max-width:600px){.clock .hand:before{height:95px}.clock .hand.hour:before{height:68px}}

/* Eye constellation laid out to match the 550×309 reference image. */
#eyes{position:fixed;inset:0;overflow:hidden;pointer-events:none;mask-image:none!important;filter:none!important;mix-blend-mode:normal!important;opacity:1!important}
#eyes:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,#ae4b4b77,transparent 58%),linear-gradient(180deg,#230408 0%,#3b0b0c 50%,#5d2224 100%);opacity:.45}
.eye{animation:none!important;filter:none!important;transform:none!important;opacity:1}
.eye svg{width:100%;height:100%;overflow:visible}
.eye:nth-child(1){z-index:4}
.eye:nth-child(n+2){z-index:2}
.eye:nth-child(n+2) svg{filter:drop-shadow(0 0 5px #a32b26)}
.eye .eye-glow{filter:blur(6px)}
@media(min-width:850px){#eyes{background-size:cover}}

/* Larger, denser constellation based on the eye reference */
#eyes{overflow:hidden!important}
.eye{transform-origin:center!important}
@media(max-width:700px){#eyes{width:100vw;height:100vh}.eye{min-width:90px!important}}

/* Original reference image replaces all synthetic SVG eyes. */
#eyes{z-index:0!important;opacity:1!important;mix-blend-mode:normal!important;mask-image:none!important;filter:none!important;background:transparent!important}
#eyes .eye,#eyes:before{display:none!important}
#eyes:after{content:"";position:absolute;inset:0;background-image:url("./ronova-eyes.jpg");background-repeat:no-repeat;background-position:center top;background-size:max(115vw,205vh) auto;opacity:.94;mask-image:linear-gradient(to bottom,#000 0%,#000 57%,transparent 95%);filter:saturate(1.16) contrast(1.12) drop-shadow(0 0 14px #b83236)}
@media(max-width:700px){#eyes:after{background-size:auto 76vh;background-position:center -2vh;mask-image:linear-gradient(to bottom,#000 0%,#000 55%,transparent 88%)}}

/* Exact clock illustration, including the asymmetric hands, red Roman numerals and purple rays. */
.clock{width:min(94vw,550px)!important;height:auto!important;aspect-ratio:550/429!important;border:0!important;border-radius:0!important;background:transparent url("./ronova-clock.png") center / contain no-repeat!important;box-shadow:none!important;filter:drop-shadow(0 0 20px #9b153380)!important;margin:0 auto 6px!important}
.clock:before,.clock:after,.clock .dial-art,.clock .sigil,.clock span,.clock .hand,.clock .center{display:none!important}
@media(max-width:600px){.clock{width:min(100vw,550px)!important;margin-top:-5px!important}}

/* Vector reconstruction of the reference clock, resolution-independent */
.clock{width:min(96vw,620px)!important;height:auto!important;aspect-ratio:550/429!important;background:none!important;filter:none!important;overflow:visible!important;margin:0 auto 0!important;isolation:isolate}
.clock:before,.clock:after{display:none!important}
.clock .ronova-clock-svg{display:block;position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 8px #ed1439a6)}
.clock .dial-art,.clock span,.clock .hand,.clock .center,.clock .sigil{display:none!important}
.ronova-clock-svg .clock-rotor{transform-box:fill-box;transform-origin:50% 50%}
.ronova-clock-svg .clock-aura{animation:ronovaAura 6s ease-in-out infinite alternate}
.ronova-clock-svg .clock-rune{animation:ronovaRune 8s ease-in-out infinite alternate}
@keyframes ronovaAura{from{opacity:.36;filter:blur(4px)}to{opacity:.75;filter:blur(8px)}}
@keyframes ronovaRune{from{opacity:.65}to{opacity:1}}
#eyes:after{background-size:cover!important;background-position:center center!important;mask-image:linear-gradient(to bottom,#000 0%,#000 78%,transparent 100%)!important;filter:contrast(1.04) saturate(1.2)!important}
body{background:radial-gradient(ellipse at 50% 44%,#46121b 0%,#210710 52%,#090208 100%)!important}
body:before{background:radial-gradient(ellipse at 50% 50%,transparent 0%,#040005aa 100%),repeating-linear-gradient(0deg,transparent 0 3px,#ff5c6707 4px 5px)!important}
#ronova-atmosphere{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:.65}
#ronova-atmosphere:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg at 50% 40%,transparent 0deg,#bc15421a 36deg,transparent 65deg,#8d12a41a 110deg,transparent 150deg,#d3151f1c 240deg,transparent 290deg);animation:ronovaMist 48s linear infinite}
#ronova-atmosphere:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 48% 20%,#d92e3838 0%,transparent 40%);animation:ronovaAura 9s ease-in-out infinite alternate}
@keyframes ronovaMist{to{transform:rotate(360deg)}}
#ronova-particles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.ronova-particle{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#e94560;box-shadow:0 0 8px 2px #e52c52;opacity:.6;animation:ronovaFloat var(--t) ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes ronovaFloat{to{transform:translate(var(--dx),-42px);opacity:.12}}
#ronova-controls{position:fixed;right:12px;bottom:12px;z-index:9;display:flex;gap:7px;align-items:center}
#ronova-controls button{background:#170713db;color:#f7c3c8;border:1px solid #9d4358;border-radius:50px;padding:9px 12px;font:13px Georgia,serif;cursor:pointer;backdrop-filter:blur(8px)}
#ronova-controls button:focus-visible{outline:2px solid #ffc1c9}
@media(prefers-reduced-motion:reduce){#ronova-atmosphere:before,#ronova-atmosphere:after,.ronova-particle,.ronova-clock-svg .clock-aura,.ronova-clock-svg .clock-rune{animation:none!important}}
</style></head><body>
<div id="eyes" aria-hidden="true"></div>
<main><div class="clock" id="clock" aria-label="Мистические часы"><div class="hand hour" id="hour"></div><div class="hand minute" id="minute"></div><div class="center"></div></div>
<div class="timer" id="timer">02:00:00</div><h1>Пророчество Роновы</h1><div class="prophecy" id="prophecy"></div><p class="note">Коснись символа, чтобы раскрыть тайну</p></main>
<dialog id="puzzle"><button class="close" id="close" aria-label="Закрыть">×</button><h2 id="puzzleTitle">Загадка</h2><p id="clue"></p><form id="answerForm"><input id="answer" autocomplete="off" placeholder="Введи разгаданное слово" required><button class="action" type="submit">Раскрыть</button><p class="error" id="error" aria-live="polite"></p></form></dialog>
<div class="expired" id="expired"><h2>Время истекло</h2><p>Чертоги Роновы закрыты.</p></div>
<script>
const text='В чертогах, где застыл последний вздох, выход откроется лишь тому, кто добровольно сотрет из сердца то, что греет память о здешнем мире';
const puzzles={
'чертогах':['Анаграмма','ГОРТЕЧАХ'],
'застыл':['Масонский шифр','Расшифруй слово с помощью масонской решётки.'],
'последний':['Цифровая замена','17-16-19-13-6-5-15-10-11'],
'вздох':['Анаграмма','ХОДВЗ'],
'выход':['Шифр Цезаря','ЁЮШСЗ'],
'откроется':['Двоичный код','Расшифруй двоичную последовательность UTF-8: '+binary('откроется')],
'лишь':['Азбука Морзе','.-.. .. ---- -..- (русская азбука Морзе)'],
'добровольно':['Двоичный код','Расшифруй двоичную последовательность UTF-8: '+binary('добровольно')],
'сотрет':['Шифр Цезаря','ФСХУИЦ'],
'сердца':['Атбаш','Расшифруй по русскому алфавиту Атбаш: '+atbash('сердца')],
'греет':['Азбука Морзе','--. .-. . . - (русская азбука Морзе)'],
'память':['Атбаш','Расшифруй по русскому алфавиту Атбаш: '+atbash('память')],
'здешнем':['Цифровая замена','9-5-6-26-15-6-14'],
'мире':['Анаграмма','РИМЕ']};
function binary(s){return [...new TextEncoder().encode(s)].map(x=>x.toString(2).padStart(8,'0')).join(' ')}
function atbash(s){let a='абвгдеёжзийклмнопрстуфхцчшщъыьэюя';return [...s].map(c=>a.includes(c)?a[a.length-1-a.indexOf(c)]:c).join('')}
const glyphs=['ᚨ','ᛒ','ᚲ','ᛞ','ᛖ','ᚠ','ᚷ','ᚺ','ᛁ','ᛃ','ᚴ','ᛚ','ᛗ','ᚾ','ᛟ','ᛈ','ᛩ','ᚱ','ᛋ','ᛏ','ᚢ','ᚡ','ᚹ','ᛪ','ᛦ','ᛉ'];function symbols(w){return [...w].map(c=>'<span class="fallback">'+glyphs[(c.toLowerCase().charCodeAt(0)+5)%glyphs.length]+'</span>').join('')}
const key='ronova-start-v1',solvedKey='ronova-solved-v1',now=Date.now();let started=Number(localStorage.getItem(key));if(!started||started>now){started=now;localStorage.setItem(key,String(started))}
let solved=new Set(JSON.parse(localStorage.getItem(solvedKey)||'[]')),active=null;
const prop=document.getElementById('prophecy'),dialog=document.getElementById('puzzle');
function render(){prop.innerHTML='';text.split(/(\s+)/).forEach((part)=>{if(/^\s+$/.test(part)){prop.append(document.createTextNode(part));return}let word=part.toLowerCase().replace(/[^а-яё]/g,'');if(puzzles[word]&&!solved.has(word)){let b=document.createElement('button');b.className='secret';b.title='Открыть загадку';b.setAttribute('aria-label','Зашифрованное слово');b.innerHTML=symbols(word)+(part.endsWith(',')?',':'');b.onclick=()=>openPuzzle(word);prop.append(b)}else{let span=document.createElement('span');span.className='word';span.textContent=part;prop.append(span)}})}
function openPuzzle(word){active=word;document.getElementById('puzzleTitle').textContent='Испытание Роновы';document.getElementById('clue').textContent=puzzles[word][0]+': '+puzzles[word][1];document.getElementById('answer').value='';document.getElementById('error').textContent='';dialog.showModal()}
document.getElementById('close').onclick=()=>dialog.close();document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();let answer=document.getElementById('answer').value.trim().toLowerCase().replace(/ё/g,'е');if(answer===active.replace(/ё/g,'е')){solved.add(active);localStorage.setItem(solvedKey,JSON.stringify([...solved]));dialog.close();render()}else document.getElementById('error').textContent='Ответ неверен. Попробуй ещё.'};
const roman=['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];roman.forEach((v,i)=>{let s=document.createElement('span');s.style.setProperty('--i',i);s.textContent=v;document.getElementById('clock').append(s)});
function tick(){let remaining=Math.max(0,7200000-(Date.now()-started)),s=Math.ceil(remaining/1000);document.getElementById('timer').textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':');document.getElementById('minute').style.transform='rotate('+((7200000-remaining)/7200000*720)+'deg)';document.getElementById('hour').style.transform='rotate('+((7200000-remaining)/7200000*60)+'deg)';if(!remaining){dialog.close();document.getElementById('expired').style.display='flex'}}tick();setInterval(tick,1000);
const eyePositions=[[4,12,125,-15],[28,8,100,12],[68,8,125,-20],[86,20,140,10],[8,46,170,10],[72,42,95,-14],[89,57,130,20],[22,76,105,-18],[60,78,145,10],[44,26,250,-5],[2,85,85,10],[79,85,110,-10]];
const eyes=document.getElementById('eyes');eyePositions.forEach(([x,y,w,r],i)=>{let e=document.createElement('div');e.className='eye';e.style.cssText='left:'+x+'%;top:'+y+'%;--w:'+w+'px;--r:'+r+'deg;--d:'+(i*.7)+'s';eyes.append(e)});
render();

/* Atmosphere, particles, and original synthesized ambient audio; user gesture required. */
(function(){
document.body.insertAdjacentHTML('afterbegin','<div id="ronova-atmosphere" aria-hidden="true"></div><div id="ronova-particles" aria-hidden="true"></div>');
const dust=document.getElementById('ronova-particles');
for(let i=0;i<24;i++){let p=document.createElement('span');p.className='ronova-particle';p.style.cssText='--x:'+((i*47.71)%100)+'%;--y:'+((i*29.17)%100)+'%;--s:'+(1+i%3)+'px;--t:'+(5+i%7)+'s;--d:'+(-i*.43)+'s;--dx:'+((i%2?1:-1)*(12+i%17))+'px';dust.append(p)}
const controls=document.createElement('div');controls.id='ronova-controls';
controls.innerHTML='<button type="button" id="ronova-sound" aria-pressed="false" title="Авторская атмосферная музыка">♫ Звук: выкл.</button><button type="button" id="ronova-effects" aria-pressed="true">✧ Эффекты</button>';
document.body.append(controls);
let ctx=null,master=null,voices=[],playing=false,fx=true;
function startSound(){
 const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
 ctx=ctx||new Audio();ctx.resume();
 master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
 const frequencies=[55,82.4069,110,164.8138,220];
 frequencies.forEach((f,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=i===0?'sine':'triangle';osc.frequency.value=f;gain.gain.value=i===0?.07:.009;osc.connect(gain);gain.connect(master);osc.start();voices.push(osc)});
 const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.13;lg.gain.value=.014;lfo.connect(lg);lg.connect(master.gain);lfo.start();voices.push(lfo);
 master.gain.setTargetAtTime(.15,ctx.currentTime,.6);
}
function stopSound(){if(master&&ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(0,ctx.currentTime,.2);const old=voices;setTimeout(()=>old.forEach(o=>{try{o.stop()}catch(e){}}),900);voices=[];master=null}}
const button=document.getElementById('ronova-sound');
button.onclick=()=>{playing=!playing;if(playing)startSound();else stopSound();button.textContent=playing?'♫ Звук: вкл.':'♫ Звук: выкл.';button.setAttribute('aria-pressed',String(playing))};
document.getElementById('ronova-effects').onclick=e=>{fx=!fx;document.getElementById('ronova-atmosphere').style.display=fx?'':'none';dust.style.display=fx?'':'none';e.currentTarget.setAttribute('aria-pressed',String(fx));e.currentTarget.textContent=fx?'✧ Эффекты':'✧ Без эффектов'};
document.addEventListener('visibilitychange',()=>{if(ctx){if(document.hidden)ctx.suspend();else if(playing)ctx.resume()}});
})();
