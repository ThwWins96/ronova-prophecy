name: Render high-resolution eye background
on:
  push:
    paths:
      - '.github/workflows/render-eyes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enhance background to 4K
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter
          from pathlib import Path
          src=Image.open('ronova-eyes.jpg').convert('RGB')
          # Retain composition; upscale smoothly and recover edge contrast.
          image=src.resize((3840,2160),Image.Resampling.LANCZOS)
          image=ImageEnhance.Contrast(image).enhance(1.13)
          image=ImageEnhance.Sharpness(image).enhance(1.45)
          image=image.filter(ImageFilter.UnsharpMask(radius=1.35,percent=145,threshold=3))
          image.save('ronova-eye-hd.webp','WEBP',quality=92,method=6)
          print('Output:',Path('ronova-eye-hd.webp').stat().st_size)
          PY
      - name: Commit background
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ronova-eye-hd.webp
          if ! git diff --cached --quiet; then
            git commit -m "Render higher-resolution eye backdrop"
            git pull --rebase
            git push
          fi
